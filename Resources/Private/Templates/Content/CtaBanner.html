<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="cta-banner" id="c{data.uid}">
	<div class="container cta-banner__inner">
		<f:if condition="{data.header}">
			<h2>{data.header}</h2>
		</f:if>
		<f:if condition="{data.bodytext}">
			<p><f:format.nl2br>{data.bodytext}</f:format.nl2br></p>
		</f:if>

		<f:if condition="{data.header_link}">
			<f:then>
				<f:link.typolink parameter="{data.header_link}" class="btn btn--primary">
					<f:if condition="{data.tx_sitepackage_button_label}">
						<f:then>{data.tx_sitepackage_button_label}</f:then>
						<f:else>CTA Button</f:else>
					</f:if>
				</f:link.typolink>
			</f:then>
		</f:if>
	</div>
</section>
</html>
